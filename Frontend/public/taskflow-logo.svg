<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .brand-fill { fill: #10B981; }
      .brand-stroke { stroke: #10B981; fill: none; }
    </style>
  </defs>
  
  <!-- Circular Ring with Gap -->
  <!-- Draws a perfect circle with a calculated 60-degree gap for the arrow to exit -->
  <path class="brand-stroke" stroke-width="4.5" stroke-linecap="round" d="M 84.773 40.683 A 36 36 0 1 1 59.317 15.227" />

  <!-- 4 Connected Nodes -->
  <g class="brand-fill">
    <circle cx="50" cy="14" r="5" /> <!-- Top Node -->
    <circle cx="14" cy="50" r="5" /> <!-- Left Node -->
    <circle cx="50" cy="86" r="5" /> <!-- Bottom Node -->
    <circle cx="86" cy="50" r="5" /> <!-- Right Node -->
  </g>

  <!-- Workflow Checkmark & Arrow -->
  <!-- Stem of the checkmark -->
  <path class="brand-stroke" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter" d="M 31 46 L 47 62 L 71 30" />
  
  <!-- Arrow Head -->
  <polygon class="brand-fill" points="80,18 63.8,24.6 78.2,35.4" />
</svg>
